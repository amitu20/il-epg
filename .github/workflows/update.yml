name: update-epg
on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grab yes.co.il guide
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git grabber
          cd grabber && npm install --no-audit --no-fund
          npm run grab --silent -- -c sites/yes.co.il/yes.co.il.channels.xml --days 5 --maxConnections 5 -o ../yes.xml
      - name: Build merged guide
        run: python3 build_epg.py
      - name: Commit
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml epg.xml.gz coverage.json
          git diff --cached --quiet || git commit -m "Update EPG" && git push
